name: Update download badge

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/update_download_badge.py
      - .github/workflows/update-download-badge.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge

jobs:
  update:
    if: github.repository == 'JacopoBassan/the-cinematic-legacy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Count installer downloads
        run: python3 .github/scripts/update_download_badge.py "$RUNNER_TEMP/badge.json"
      - name: Publish badge data
        shell: bash
        run: |
          branch=download-stats
          if git ls-remote --exit-code --heads origin "$branch"; then
            git fetch --depth=1 origin "refs/heads/$branch"
            git switch --detach FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git switch --orphan "$branch"
          fi

          cp "$RUNNER_TEMP/badge.json" badge.json
          git add -- badge.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update installer download count'
          git push origin "HEAD:refs/heads/$branch"
