name: Check launcher source

on:
  push:
    branches: [main]
    paths: ["docs/mods.json", ".github/workflows/check-source.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.25.1
      - name: Validate against the launcher schema
        env:
          SCHEMA_URL: https://raw.githubusercontent.com/open-goal/launcher/9e4fc050d98ed452e7e340b62c981e3df00699c0/schemas/mod-source/v1/mod-source-schema.v1.json
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import urlopen
          from jsonschema import validate

          with urlopen(os.environ["SCHEMA_URL"], timeout=30) as response:
              schema = json.load(response)
          with open("docs/mods.json", encoding="utf-8") as source:
              data = json.load(source)
          validate(data, schema)
          print(f"Validated {len(data['mods'])} mods against the launcher schema")
          PY
